# ==============================================================================
# PROJETO MERCADO - CONFIGURAÇÃO RENDER BLUEPRINT (render.yaml)
# Define o Web Service Node.js e a instância gerenciada do PostgreSQL no Render.
# ==============================================================================
services:
  - type: web
    name: mercado-app
    env: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mercado-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h

databases:
  - name: mercado-db
    databaseName: mercado
    user: mercado_user
    plan: free
    region: oregon
